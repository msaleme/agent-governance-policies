name: Verify policies
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policies:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned build tools
        run: |
          rustup toolchain install 1.89.0 --profile minimal \
            --component rustfmt --component clippy --target wasm32-wasip1
      - name: Verify each policy
        shell: bash
        run: |
          set -euo pipefail
          for policy in approval-execution-binding aggregate-risk-gate; do
            (
              cd "$policy"
              cargo +1.89.0 fetch --locked
              cargo +1.89.0 fmt --check
              cargo +1.89.0 clippy --lib --locked --offline -- -D warnings
              cargo +1.89.0 test --lib --locked --offline
              cargo +1.89.0 test --tests --no-run --locked --offline
              cargo +1.89.0 build --release --target wasm32-wasip1 --locked --offline
            )
          done
      # Runtime suites require separately authorized disposable Flex registrations.
      # No registration or platform credentials are supplied to this workflow.

  # Full PDK packaging path from a clean checkout: generate the definition and
  # implementation assets exactly as `make build` / `make release` would, prove
  # src/generated/config.rs is in sync with gcl.yaml, reject placeholder or
  # invalid Exchange metadata, and keep the generated files as an artifact.
  # ANYPOINT_GROUP_ID is a repository *variable* (an org UUID, not a secret);
  # Cargo.toml keeps its placeholder and is only rewritten inside this job.
  exchange-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        policy: [approval-execution-binding, aggregate-risk-gate]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pinned PDK tooling
        run: |
          rustup toolchain install 1.89.0 --profile minimal \
            --component rustfmt --component clippy --target wasm32-wasip1
          npm install -g anypoint-cli-v4-public@1.6.27
          anypoint-cli-v4 plugins:install anypoint-pdk-plugin@1.9.0
          cargo +1.89.0 install --locked cargo-anypoint@1.10.0
          python3 -c "import yaml"
      - name: Generate assets
        shell: bash
        env:
          ANYPOINT_GROUP_ID: ${{ vars.ANYPOINT_GROUP_ID }}
        working-directory: ${{ matrix.policy }}
        run: |
          set -euo pipefail
          if [[ ! "${ANYPOINT_GROUP_ID:-}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "::error::Repository variable ANYPOINT_GROUP_ID must be the owning Anypoint org UUID"
            exit 1
          fi
          sed -i "s/REPLACE_WITH_YOUR_ANYPOINT_ORG_ID/${ANYPOINT_GROUP_ID}/" Cargo.toml
          make build
          git checkout -- Cargo.toml
          git diff --exit-code -- src/generated/config.rs
      - name: Validate Exchange metadata
        run: python3 scripts/check_exchange_metadata.py ${{ matrix.policy }} --assets
      - uses: actions/upload-artifact@v4
        with:
          name: exchange-assets-${{ matrix.policy }}
          if-no-files-found: error
          path: |
            ${{ matrix.policy }}/target/implementation/
            ${{ matrix.policy }}/target/implementation-dev/
            ${{ matrix.policy }}/target/wasm32-wasip1/release/*.wasm
            ${{ matrix.policy }}/target/wasm32-wasip1/release/*_definition.yaml
            ${{ matrix.policy }}/target/wasm32-wasip1/release/*_implementation.yaml
