[package]
name = "approval_execution_binding"
version = "1.0.0"
rust-version = "1.89.0"
edition = "2018"
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.anypoint]
group_id = "REPLACE_WITH_YOUR_ANYPOINT_ORG_ID"
definition_asset_id = "approval-execution-binding"
implementation_asset_id = "approval-execution-binding-flex"

[dependencies]
# enable_stop_iteration exposes into_headers_body_state, so a single filter can
# both inspect the body and stamp/modify headers on the same request/response.
pdk = { version = "=1.10.0", features = ["enable_stop_iteration"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
anyhow = "1.0"
# Real cryptography for the P5 attestation check: HMAC-SHA256 over the JCS-canonicalized
# approval scope, matching the ABV v0.1 reference checker's keyed-digest attestation model.
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
# Real wall-clock time for P4 freshness (never a caller-supplied "now") and RFC 3339
# parsing of not_after. `clock` pulls in Utc::now(); no local-timezone lookup is used.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
pdk-test = { version = "=1.10.0" }
pdk-unit = { version = "=1.10.0", features = ["enable_stop_iteration", "experimental"] }
httpmock = "0.6"
reqwest = "0.11"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
opt-level = 'z'
strip = "debuginfo"
