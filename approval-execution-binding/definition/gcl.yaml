---
apiVersion: gateway.mulesoft.com/v1alpha1
kind: Extension
metadata:
  labels:
    title: Approval-to-Execution Binding
    category: Security
    description: >-
      Binds an MCP tools/call to its approval: same action (P1), canonical
      arguments (P2), fresh (P4), separately attested mcp-v1 payload (P5),
      single use per replica until restart (P6). Other methods and bodyless
      GET/DELETE pass through.
    metadata/capabilities/injectionPoint: inbound
    metadata/capabilities/assetTypes: mcp
    metadata/interfaceScope: api,resource
spec:
  extends:
    - name: extension-definition
      namespace: default
  properties:
    approvalSource:
      type: string
      default: header
      enum:
        - header
        - rpc-param
        - sidecar
      description: >-
        Where the approval envelope rides. "header" (implemented) — a single
        JSON object in the request header named by approvalHeader. "rpc-param"
        (implemented) — a single JSON object under the top-level request-body
        member named by approvalRpcField, sibling to the JSON-RPC envelope
        (jsonrpc/id/method/params). "sidecar" — fetching the approval record from
        an external attestation service keyed off the request is NOT implemented
        in this build; selecting it fails policy startup with a clear error
        rather than silently no-op-ing, so a misconfiguration cannot be mistaken
        for an armed binding.
    approvalHeader:
      type: string
      default: x-approval
      description: >-
        Header name carrying the JSON-encoded approval envelope when
        approvalSource=header. The envelope shape is
        {"approval":{"scope":{"action":...,"arguments_digest":...},"authority":...,
        "not_after":...,"nonce":...},"attestations":[{"claim":"approval",
        "authority":...,"mac":...}]}. Reference-shaped arguments ($ref) are not
        supported and are rejected under P2 — the approved and executed argument
        bytes must match directly, with no dereferencing step.
    approvalRpcField:
      type: string
      default: approvalBinding
      description: >-
        Top-level JSON-RPC request-body member carrying the approval envelope
        (same shape as approvalHeader's value) when approvalSource=rpc-param.
        Must not be a JSON-RPC member name (jsonrpc, id, method, params, result,
        error); such a value is rejected at startup. Removed from the
        forwarded body unless stripApprovalEnvelope is false.
    executorHeader:
      type: string
      default: client_id
      description: >-
        Fallback header naming the party about to execute. The executor identity
        is taken FIRST from the VERIFIED authentication data (client_id, then
        principal) established by an upstream authentication policy — e.g. OpenID
        Connect Access Token Enforcement, JWT Validation, or Client ID
        Enforcement placed before this policy in the chain. This header is used
        only when no verified subject is present; when P5 is required and there
        is no verified subject, the call fails closed rather than trusting a
        caller-asserted header. Used for P5: an approval attested by this same
        identity is not a separate attestation.
    requiredPredicates:
      type: array
      default: [P1, P2, P4, P5]
      items:
        type: string
        enum:
          - P1
          - P2
          - P4
          - P5
          - P6
      description: >-
        Predicates that MUST hold for the execution to be allowed; any that
        fails denies the call in block mode (or logs a would-deny verdict in
        monitor mode). P1 action match; P2 canonical argument-byte match
        ($ref-shaped arguments are rejected, not dereferenced); P4 freshness;
        P5 a separate attester's HMAC over the versioned mcp-v1 payload; P6
        (opt-in) single use PER GATEWAY REPLICA, UNTIL RESTART, enforced
        atomically via local gateway data storage in block mode only — a replay
        on another replica or after a restart is not caught, so deploy a single
        replica for flows that need P6. Startup rejects P6 without P4 and warns
        when P6 is enabled without P5 (the nonce is then unauthenticated). Nonces
        are limited to 128 UTF-8 bytes. Reserved nonces
        have an approximate per-worker cap of 10,000; at the cap only P4-expired
        ones are reclaimed, and a full store fails closed; the sweep's key listing
        and the replay pre-check are not yet verified on a real gateway. P6 is a profile choice, not a universal rule —
        reusable approvals are legitimate in some flows — so it defaults out of the
        required set; opt in only when the customer's flow is single-use. An
        empty list is rejected at startup: a binding that requires nothing is
        not a binding.
    attesterKeys:
      type: array
      default: []
      items:
        type: object
        properties:
          kid:
            type: string
          key:
            type: string
            "@context":
              "@characteristics":
                - "security:sensitive"
        required:
          - kid
          - key
      description: >-
        Known attester keys for verifying the P5 attestation HMAC-SHA256 over the
        versioned mcp-v1 payload: kid is the attesting authority's identifier
        (must differ from the executor for P5 to hold), key is the shared secret
        this gateway holds for that authority. Keys must be at least 32 bytes;
        a shorter key is rejected at startup. In a production PKI deployment
        attesterKeys would instead reference a JWKS of the attesters' public keys
        and verify asymmetric signatures; this build implements only the
        symmetric shared-secret form. An attestation from an authority not listed
        here always fails P5. HMAC provides separation-of-duties, not
        non-repudiation.
    clockSkewSeconds:
      type: integer
      default: 60
      minimum: 0
      maximum: 3600
      description: >-
        Tolerance, in seconds (0 to 3600), applied to P4 freshness. The approval
        is valid while now <= not_after + clockSkewSeconds, where "now" is this
        gateway's own wall-clock time at the instant of the request — never a
        caller-supplied timestamp, since a caller-supplied execution instant
        would let the executing party grade its own freshness check. A value
        outside 0 to 3600 is rejected at startup.
    maxApprovalLifetimeSeconds:
      type: integer
      default: 0
      minimum: 0
      maximum: 31536000
      description: >-
        Optional upper bound on an approval's REMAINING lifetime, enforced under
        P4. 0 (the default) turns the bound off. When set (1 to 31536000), an
        approval whose not_after is later than now + maxApprovalLifetimeSeconds +
        clockSkewSeconds (gateway clock) is denied under P4, so an approval
        minted with a not_after years away cannot be reused indefinitely; it
        also bounds how long a P6 nonce is held. Setting it without P4 in
        requiredPredicates is rejected at startup. not_after is authenticated
        only when P5 is required (it is in the mcp-v1 payload); without P5 the
        bound applies to a caller-supplied value.
    stripApprovalEnvelope:
      type: boolean
      default: true
      description: >-
        When approvalSource=rpc-param, remove the approvalRpcField member from
        the request body before it is forwarded upstream (an allowed call, or a
        monitor-mode forward), so the MCP server never receives the approval or
        its attestation MACs and a strict JSON-RPC server does not see an
        unknown top-level member. The member is cut out byte-for-byte (the rest
        of the body is not re-serialized) and content-length is removed so the
        host frames the body. With approvalSource=header, remove the configured
        approvalHeader after evaluation. Both sources are stripped in block and
        monitor mode. Set false only if the upstream must see the envelope.
    clientResponses:
      type: string
      default: forward
      enum:
        - forward
        - deny
      description: >-
        How a well-formed JSON-RPC response POSTed by the client (its reply to a
        server-initiated roots/list, sampling/createMessage or elicitation/create
        request) is handled. Such a response is not a tool call, but it is input
        to an in-flight server request (an elicitation answer can choose, say,
        the target environment of an approved call), and the approval does NOT
        bind it. "forward" passes it through untouched, stamped out-of-scope, in
        both modes, so MCP clients that answer server requests keep working.
        "deny" treats it as malformed, as before this option existed (denied in
        block mode, flagged and forwarded in monitor mode); choose it when
        approvals must also cover elicitation and sampling input. An ambiguous
        or malformed response, and any batch, fails closed either way.
    expectedAudience:
      type: string
      default: ""
      description: >-
        This gateway's deployment audience, bound into the P5 mcp-v1 payload as
        `aud`. An approval MAC computed for a different audience will not verify,
        preventing an attestation minted for one gateway from being replayed at
        another. Required (non-empty) whenever P5 is in requiredPredicates.
    expectedTenant:
      type: string
      default: ""
      description: >-
        The tenant this gateway serves, bound into the P5 mcp-v1 payload as
        `tenant`, so an approval minted for one tenant cannot be replayed against
        another. Required (non-empty) whenever P5 is in requiredPredicates.
    expectedEnvironment:
      type: string
      default: ""
      description: >-
        The environment this gateway serves (e.g. prod), bound into the P5
        mcp-v1 payload as `env`, so an approval minted in one environment cannot
        be replayed in another. Required (non-empty) whenever P5 is in
        requiredPredicates.
    mode:
      type: string
      default: monitor
      enum:
        - monitor
        - block
      description: >-
        "monitor" — evaluate every required predicate and log the verdict
        (allow, or the specific predicate that would have failed) via a
        structured warning, but always forward the request. Use to characterize
        traffic before enforcing. Monitor still strips the approval envelope
        when stripApprovalEnvelope is enabled. "block" — deny the request when a required
        predicate fails, per onDeny. Every deployment, including monitor,
        requires change-management review of what the approval envelope and
        attesterKeys disclose to logs.
    onDeny:
      type: string
      default: rpc-error
      enum:
        - rpc-error
        - empty-403
      description: >-
        How a block-mode denial is rendered. "rpc-error" — an in-band JSON-RPC
        response reusing the request's own id, error code -32008, with a message
        naming only the failed predicate (never the approved or executed
        argument values). "empty-403" — an HTTP 403 with an empty body and no
        JSON-RPC envelope. Regardless of this setting, a request this policy
        cannot confidently parse as a single, non-batch JSON-RPC call with an
        echoable id always falls back to empty-403 — echoing an id we cannot
        trust risks exposing a protected value, mirroring the decoy-coordinator's
        containment rule; that includes a POST refused for framing (no valid
        declared content-length of at most 64 KiB, e.g. chunked or HTTP/2),
        stamped "denied;framing=content-length". A JSON-RPC notification (no id)
        always gets an empty HTTP 202, since JSON-RPC forbids a response to a
        notification either way. A bodyless non-POST request (the MCP GET SSE
        stream, a DELETE session teardown, OPTIONS, HEAD) is never denied: it is
        forwarded untouched, stamped "out-of-scope", in both modes.
    resultHeader:
      type: string
      default: x-approval-binding
      description: >-
        Header stamped on the request forwarded upstream (monitor mode, or an
        allowed request in block mode) or on the denial response (block mode)
        recording the verdict, e.g. "allowed", "out-of-scope",
        "would-deny;predicate=P2", "denied;predicate=P5", or
        "denied;framing=content-length". Never carries the approval or argument values
        themselves — only the predicate code — so it is safe to forward to
        downstream logging, SIEM, or a Kill Switch without a further redaction
        pass.
  required:
    - approvalSource
    - approvalHeader
    - approvalRpcField
    - executorHeader
    - requiredPredicates
    - attesterKeys
    - clockSkewSeconds
    - mode
    - onDeny
    - resultHeader
