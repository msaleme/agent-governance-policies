---
apiVersion: gateway.mulesoft.com/v1alpha1
kind: ApiInstance
metadata:
  name: ingress-http
spec:
  address: http://0.0.0.0:8081
  services:
    upstream:
      address: http://backend
      routes:
        - config:
            destinationPath: /anything/echo/
  policies:
    - policyRef:
        name: mcp-honeytoken-tripwire-v1-0-impl # Generated implementation extension name
      config:
        honeytokens:
          - acct_DECOY_9x1f-do-not-use
        mode: block
        alertHeader: x-agent-decoy-tripwire
        caseSensitive: false
