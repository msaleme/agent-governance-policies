---
apiVersion: gateway.mulesoft.com/v1alpha1
kind: Extension
metadata:
  labels:
    title: Cross-Session Aggregate-Risk Gate
    category: Security
    description: >-
      Reserve-then-authorize exposure gate for MCP: reserves each governed
      call's contribution (default: tools/call only) against a per-scope
      budget before forwarding. One budget per gateway replica, shared by its
      workers; reset on restart (see README).
    metadata/capabilities/injectionPoint: inbound
    metadata/capabilities/assetTypes: mcp
    metadata/interfaceScope: api,resource
spec:
  extends:
    - name: extension-definition
      namespace: default
  properties:
    # BUDGET SCOPE DEPENDS ON ledgerBackend. "node" (default): the ledger is
    # in the gateway replica's node-local shared data, so every Envoy worker
    # of one replica shares one budget. It is not shared across replicas and
    # a gateway process restart resets it; with R replicas set aggregateBudget
    # to the intended total divided by R. "worker": the ledger lives in each
    # Envoy worker's memory, and a caller that opens more connections can be
    # spread across N workers and spend up to N times aggregateBudget; run
    # one worker (FLEX_SERVICE_ENVOY_CONCURRENCY=1) or divide the budget by N
    # workers times replicas. See budgetScope, ledgerBackend and the README.
    budgetScope:
      type: string
      default: agent
      enum:
        - agent
        - fabric
        - tenant
      description: >-
        The aggregation dimension the ledger keys on. "agent" — one running
        total per verified agent identity (see identitySource). "tenant" — the
        same mechanics, intended for a tenant/org identity rather than a
        per-agent one. "fabric" — one running total shared by every request
        this policy instance sees; no identity is read. The ledger key is
        "<budgetScope>:<canonical identity>", or "fabric:*". With
        ledgerBackend "node" (default) every scope's budget is per gateway
        replica: all workers share it, but replicas do not, and a process
        restart resets it. With ledgerBackend "worker" it is per gateway
        worker: a caller that opens more connections can be spread across N
        workers and spend up to N times aggregateBudget. For an exact budget
        there, run one worker (FLEX_SERVICE_ENVOY_CONCURRENCY=1) and one
        replica, or divide aggregateBudget by N workers times replicas.
    identitySource:
      type: string
      default: authentication
      enum:
        - authentication
        - trusted-header
      description: >-
        Where the agent/tenant identity comes from. "authentication" (default)
        reads verified PDK authentication data set by an authentication policy
        that runs BEFORE this one (Client ID Enforcement, JWT Validation,
        OAuth 2.0 introspection), so a caller cannot choose or rotate its own
        budget. A request with no verified identity fails closed in block
        mode. "trusted-header" reads scopeHeader instead. Use it only when an
        earlier policy in the chain removes any caller-supplied copy of that
        header and injects the trusted identity (see the policy README). This
        policy cannot verify that the chain is in place. A request carrying the
        header more than once is refused as ambiguous.
    identityField:
      type: string
      default: client_id
      description: >-
        With identitySource "authentication", which verified field names the
        identity. "client_id", "principal", or "properties.<dot.path>" for a
        string claim the authentication policy exposes (e.g.
        "properties.claims.tenant_id"). Ignored otherwise.
    scopeHeader:
      type: string
      default: x-agent-id
      description: >-
        With identitySource "trusted-header", the request header carrying the
        trusted identity for "agent" or "tenant" budgetScope. Ignored
        otherwise.
    maxScopes:
      type: integer
      default: 10000
      minimum: 1
      maximum: 1000000
      description: >-
        The most scopes the ledger tracks at once. Identities are canonicalized
        first (surrounding spaces/tabs trimmed, ASCII lowercased) and must be 1
        to 256 visible ASCII characters with no comma, semicolon, equals sign,
        quote, or backslash. Anything else fails closed in block mode with
        reason=invalid-identity. At the cap, a new scope evicts an idle scope
        (nothing committed or reserved). If every tracked scope holds exposure,
        the new scope is refused with reason=scope-capacity. Live enforcement
        state is never evicted.
    ledgerBackend:
      type: string
      default: node
      enum:
        - node
        - worker
      description: >-
        Where the ledger lives. "node" (default) keeps it in the gateway
        replica's node-local shared data and updates it with compare-and-swap,
        so every Envoy worker of the replica checks and reserves against one
        budget; a call whose update keeps losing to concurrent writers, or
        that hits a storage error, fails closed in block mode with
        reason=ledger-contention or reason=ledger-unavailable (monitor mode
        forwards and flags it). Not shared across replicas; reset when the
        gateway process restarts. "worker" keeps one in-memory ledger per
        Envoy worker (N workers can admit up to N times aggregateBudget). A
        cluster-wide ledger is not implemented, and "cluster" is rejected.
    ledgerNamespace:
      type: string
      default: ""
      description: >-
        With ledgerBackend "node", an optional name (1 to 64 letters, digits,
        dots, underscores, or hyphens) that lets several policy instances on
        the same gateway share one ledger. Empty (default) keeps the ledger
        private to this policy instance. Instances sharing a namespace must
        use the same scopeDigestKey, maxScopes, reservationTimeoutMs, window
        and windowMs; changing scopeDigestKey starts every scope from zero.
    reservationTimeoutMs:
      type: integer
      default: 60000
      minimum: 1000
      maximum: 86400000
      description: >-
        How long, in milliseconds, a reservation may stay unsettled. A request
        whose response never reaches this policy (client disconnect,
        cancellation, upstream timeout without a response) leaves its
        reservation held; after this timeout the reservation is reclaimed and
        its budget freed. Set it above the longest upstream timeout. A response
        that arrives within one further timeout still settles: a success is
        charged, a failure changes nothing. Later responses are ignored.
    scopeDisclosure:
      type: string
      default: digest
      enum:
        - digest
        - none
        - raw
      description: >-
        How the scope appears in resultHeader and denial messages. "digest"
        (default) shows "<budgetScope>:hmac-<16 hex>" (or "sha256-" when
        scopeDigestKey is empty), a stable pseudonym. "none" shows only the
        budgetScope. "raw" shows the canonical identity itself; use it only
        when identities are not sensitive. The policy never logs identities.
    scopeDigestKey:
      type: string
      default: ""
      "@context":
        "@characteristics":
          - "security:sensitive"
      description: >-
        Secret key for the "digest" scopeDisclosure (HMAC-SHA256). With a key,
        a client cannot confirm a guessed identity from its digest. When empty,
        an unkeyed SHA-256 is used, which hides the value but lets anyone who
        can guess an identity confirm it.
    aggregateBudget:
      type: integer
      default: 3000
      minimum: 0
      maximum: 9007199254740991
      description: >-
        The exposure budget for the scope, as an exact non-negative integer in
        the same unit as contribution: fixed-weight points, estimated tokens,
        or minor units of spendCurrency (e.g. cents for USD). Range 0 to
        9007199254740991 (2^53 - 1). A call is authorized only if committed-plus-reserved
        exposure for its scope, including this call's own contribution, does
        not exceed this number. All budget arithmetic is exact integer
        arithmetic; fractional, negative, or out-of-range values are rejected
        when the policy is configured. This budget is enforced per gateway
        replica with ledgerBackend "node", or per worker with "worker", where
        N workers let a caller reach up to N times this number (see
        budgetScope).
    window:
      type: string
      default: fixed-period
      enum:
        - fixed-period
        - worker-lifetime
      description: >-
        How long committed exposure counts against aggregateBudget.
        "fixed-period" resets every scope's committed total at each windowMs
        boundary, counted from the Unix epoch (24h windows start at 00:00
        UTC). Calls still in flight at a boundary carry into the new period.
        "worker-lifetime" never resets for as long as the ledger lives: the
        gateway process with ledgerBackend "node", the worker with "worker".
        A restart resets it either way (see README).
    windowMs:
      type: integer
      default: 86400000
      minimum: 60000
      maximum: 31622400000
      description: >-
        With window "fixed-period", the window length in milliseconds, from 1
        minute to 366 days. Ignored with "worker-lifetime".
    contribution:
      type: string
      default: fixed-weight
      enum:
        - estimated-token-weight
        - spend-amount
        - fixed-weight
      description: >-
        How this call's exposure contribution is computed, always as an exact
        integer. "fixed-weight" — fixedWeight points per call. "spend-amount" —
        an integer count of spendCurrency minor units read from the request
        body at spendAmountField. "estimated-token-weight" — a fixed charge of
        estimatedTokens per call. This is NOT measured token cost: the policy
        never reads actual token usage, so the estimate is the charge on every
        successful call, whatever the real usage was. (Renamed from
        "token-cost", which is now rejected so it cannot be mistaken for
        actual token accounting.) Only requests whose method is listed in
        governedMethods are priced; everything else passes uncharged (see
        governedMethods). A JSON-RPC batch (array) is charged per governed
        item, never as a single call. A contribution above 9007199254740991 is
        rejected as out of range.
    fixedWeight:
      type: integer
      default: 1
      minimum: 0
      maximum: 9007199254740991
      description: >-
        Per-call exposure contribution, in integer points, when
        contribution=fixed-weight. Range 0 to 9007199254740991.
    governedMethods:
      type: array
      default:
        - tools/call
      items:
        type: string
      description: >-
        The JSON-RPC methods this policy prices and enforces. Default
        ["tools/call"]. Matching is exact and case-sensitive ("Tools/Call" is
        not "tools/call"). Any other request, a notification of an unlisted
        method, a JSON-RPC response (e.g. an elicitation or sampling reply),
        and a request with no body are ungoverned: forwarded with no ledger or
        scope change and stamped "pass;reason=ungoverned-method". So an
        exhausted budget never blocks initialize, notifications/initialized,
        ping, tools/list, notifications/cancelled, or session teardown. A
        message the policy cannot classify (a body over the inspection limit,
        a Content-Type charset other than utf-8, a body this policy cannot
        parse as JSON, a non-object item, a missing "jsonrpc": "2.0", a non-string
        method, or a duplicate "method" member) stays governed and fails
        closed in block mode. In a mixed batch only the governed items are
        priced; if the batch is denied, every request id in it gets a -32008
        error. The list must be non-empty, with no blank, whitespace-padded,
        or duplicate entries; "*" is rejected (there is no wildcard).
        Listing initialize or a notifications/* method is allowed but logged
        as a warning, since it lets an exhausted budget block session setup or
        cancellation.
    spendAmountField:
      type: string
      default: params.amount
      description: >-
        Dot-separated path into the parsed JSON-RPC request body's top-level
        object read for the spend amount when contribution=spend-amount (e.g.
        "params.amount" reads body.params.amount). The value must be a JSON
        integer count of spendCurrency minor units, between 0 and
        9007199254740991: 1234 means 12.34 USD. A fraction (12.34 or 1234.0),
        an exponent (1e3), a negative value, a string, or anything out of
        range is rejected, never rounded. A governed request whose body is
        unparseable or has no valid amount at this path is unpriceable:
        denied in block mode (onDeny applies), recorded as zero contribution
        in monitor mode so the gap is visible. Ungoverned methods (see
        governedMethods) are never read for an amount.
    spendCurrency:
      type: string
      default: USD
      description: >-
        ISO 4217 code (three uppercase letters) of the currency spend amounts
        are denominated in. Amounts and aggregateBudget are counted in this
        currency's minor unit as ISO 4217 defines it (cents for USD, yen for
        JPY, which has no minor unit). Only used when contribution=spend-amount;
        always validated, and stamped into resultHeader as unit=<code>-minor.
    estimatedTokens:
      type: integer
      default: 500
      minimum: 0
      maximum: 9007199254740991
      description: >-
        Integer token charge per call when contribution=estimated-token-weight.
        Range 0 to 9007199254740991. It is reserved before the call and committed
        unchanged on a successful response; actual usage is never read, so
        there is no true-up in either direction. Set it too low and real
        consumption is under-counted; set it too high and successful calls are
        over-charged. It is released in full if the upstream returns HTTP 4xx
        or 5xx (see mode for the full settlement rule).
    mode:
      type: string
      default: monitor
      enum:
        - monitor
        - block
      description: >-
        "monitor" — reserve and commit every call's real contribution against
        the ledger so the running total reflects true composition, log the
        verdict the call would have received, but always forward the request
        regardless of budget. Use to characterize composition before enforcing.
        "block" — deny a call whose contribution would push committed-plus-
        reserved exposure for its scope over aggregateBudget, per onDeny.
        In both modes a reservation settles on the upstream's HTTP status
        only: 2xx and 3xx commit it, 4xx and 5xx release it. The response body
        is never read, so a JSON-RPC error or an "isError": true tool result
        inside an HTTP 200 is still charged.
    onDeny:
      type: string
      default: rpc-error
      enum:
        - rpc-error
        - empty-403
      description: >-
        How a block-mode denial is rendered. "rpc-error" — an in-band JSON-RPC
        response reusing the request's own id(s), error code -32008, with a
        message naming the scope and the budget that would be exceeded (never
        other sessions' call content); a JSON-RPC BATCH (array) request denied
        atomically gets back a matching JSON array with one -32008 error per
        id, never a single collapsed error. "empty-403" — an HTTP 403 with an
        empty body and no JSON-RPC envelope. Regardless of this setting, a
        request this policy cannot confidently parse as JSON-RPC with
        echoable id(s) — including an ambiguous body with a duplicate JSON
        object member, where this policy and the upstream tool could
        legitimately disagree about which id is "the" id — always falls back
        to empty-403: echoing an id it cannot trust risks exposing a protected
        value. A JSON-RPC notification (no id) always gets an empty HTTP 202
        on deny, since JSON-RPC forbids a response to a notification either
        way.
    resultHeader:
      type: string
      default: x-aggregate-risk-gate
      description: >-
        Header stamped on the CLIENT-FACING RESPONSE recording the verdict and
        the running total — on an allowed or monitored call, e.g.
        "allowed;scope=agent:broker-7;contribution=800;total=2400/3000;unit=points"
        or "monitor;scope=...;contribution=...;total=.../..."; on a block-mode
        denial, e.g. "denied;scope=agent:broker-7;would-be-total=3200;
        budget=3000;unit=points" (or "reason=missing-identity",
        "reason=invalid-identity", "reason=scope-capacity",
        "reason=ledger-contention", "reason=ledger-unavailable",
        "reason=unpriceable", or "reason=out-of-range" for the non-budget deny
        reasons); on an ungoverned message (see governedMethods),
        "pass;reason=ungoverned-method". The scope is shown per scopeDisclosure; the examples use
        "raw". All amounts are exact integers; unit is "points"
        (fixed-weight), "estimated-tokens" (estimated-token-weight), or
        "<spendCurrency>-minor" such as "USD-minor" (spend-amount). Never carries other sessions'
        call content — only the scope key and the numeric totals — so it is
        safe to forward to downstream logging, SIEM, or a Kill Switch without a
        further redaction pass.
  required:
    - budgetScope
    - identitySource
    - identityField
    - scopeHeader
    - maxScopes
    - ledgerBackend
    - ledgerNamespace
    - reservationTimeoutMs
    - scopeDisclosure
    - scopeDigestKey
    - aggregateBudget
    - window
    - windowMs
    - contribution
    - fixedWeight
    - governedMethods
    - spendAmountField
    - spendCurrency
    - estimatedTokens
    - mode
    - onDeny
    - resultHeader
