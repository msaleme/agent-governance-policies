---
apiVersion: gateway.mulesoft.com/v1alpha1
kind: Extension
metadata:
  labels:
    title: Cross-Session Aggregate-Risk Gate
    category: Security
    description: >-
      Individually valid calls can still compose past a budget nobody ever handed
      to a single decision: a broker fleet where each session clears its own
      per-session cap, but the fleet's totals blow an aggregate exposure budget
      no per-call control ever sees — slow spend drift, distributed data pulls
      that sum to an exfiltration, or a concurrent burst that a naive running
      counter waves through because every reader sees the same pre-commit
      snapshot. This policy closes that gap with reserve-then-authorize: on every
      governed call it computes the call's exposure contribution (token cost,
      a spend amount read from the request body, or a fixed per-call weight),
      reserves that contribution against a serialized ledger keyed by budget
      scope (per agent, per fabric, per tenant) BEFORE authorizing, allows the
      call only if committed-plus-reserved exposure stays within the aggregate
      budget, commits the reservation on a successful upstream response, and
      releases it on failure. Reserve-then-authorize is the load-bearing
      property: a read-then-write counter breaches under concurrency because
      concurrent callers all check the same stale total before anyone writes;
      only serializing the check-and-reserve into one step holds the budget.
      Honesty boundary (Stage A vs Stage B): this build ships Stage A — an
      in-process, serialized ledger scoped to a single gateway worker. It is a
      real, atomic reserve-then-authorize engine, exhaustively tested including
      the concurrent-race case, but it is a single serialization point, not a
      distributed multi-region ledger. A distributed, replay-consistent ledger
      with signed decision records (Stage B) is unshipped roadmap work and is
      not implemented here; do not present Stage A as that. Deploys as an
      inbound policy on the same MCP/A2A/LLM-proxy instances Agent Fabric
      already fronts, keyed to the identity header the fabric already carries,
      and reuses the token-usage signal the gateway's cost dashboards already
      produce for the token-cost contribution mode.
    metadata/capabilities/injectionPoint: inbound
    metadata/interfaceScope: api,resource
spec:
  extends:
    - name: extension-definition
      namespace: default
  properties:
    budgetScope:
      type: string
      default: agent
      enum:
        - agent
        - fabric
        - tenant
      description: >-
        The aggregation dimension the ledger keys on. "agent" — one running
        total per identity value read from scopeHeader (e.g. one broker
        session's fleet). "fabric" — one running total shared across every
        request this policy instance sees, ignoring scopeHeader (the whole
        fronted fabric shares one budget). "tenant" — one running total per
        value read from scopeHeader, intended for a tenant/org identifier
        rather than a per-agent one; the mechanics are identical to "agent",
        only the intended header semantics differ. The concrete ledger key is
        "<budgetScope>:<value>" ("fabric" uses a fixed value since it has no
        per-identity header).
    scopeHeader:
      type: string
      default: x-agent-id
      description: >-
        Request header carrying the identity value used to key the ledger when
        budgetScope is "agent" or "tenant". Ignored when budgetScope is
        "fabric". A request missing this header when it is required fails
        closed in block mode (denied, onDeny applies) and is recorded under a
        fixed "(missing)" key in monitor mode so the gap is visible on
        dashboards rather than silently dropped.
    aggregateBudget:
      type: number
      default: 3000
      description: >-
        The exposure budget for the scope's current window, in the same units
        as contribution (tokens, spend units, or fixed-weight points). A call
        is authorized only if committed-plus-reserved exposure for its scope,
        including this call's own contribution, does not exceed this number.
    window:
      type: string
      default: rolling-24h
      enum:
        - rolling-24h
        - fixed-period
      description: >-
        The accounting window the aggregateBudget applies to. This build's
        Stage A ledger keeps one continuously-accumulating total per scope for
        the life of the running gateway worker — it does NOT roll off entries
        older than a fixed period or reset on a calendar boundary. "rolling-24h"
        and "fixed-period" are both accepted values, but both currently receive
        the identical continuously-accumulating behavior; per-window expiry is
        Stage B roadmap work (it needs a real clock-driven eviction policy
        against the distributed ledger, not a per-request approximation). This
        field is accepted and stamped into logs/headers today for forward
        compatibility with that roadmap, not silently ignored, but it does not
        yet change enforcement.
    contribution:
      type: string
      default: fixed-weight
      enum:
        - token-cost
        - spend-amount
        - fixed-weight
      description: >-
        How this call's exposure contribution is computed. "fixed-weight" — a
        static per-call weight from fixedWeight, known before the call is
        authorized. "spend-amount" — a numeric field read from the request
        JSON-RPC body at spendAmountField, known before the call is authorized.
        "token-cost" — pre-flight token cost is not exactly knowable, so the
        reservation uses estimatedTokens as a stand-in and this build commits
        that same estimate on a successful response (this build's response
        handling is headers-only and never reads the response body, so it has
        no real usage.total_tokens figure to true up against — see
        estimatedTokens and the Honesty boundaries section in README.md); a
        future build could settle to a real figure without changing this
        field's meaning. A JSON-RPC BATCH (array) request's per-item
        contribution is multiplied/summed across every item in the array, not
        priced as a single call.
    fixedWeight:
      type: number
      default: 1
      description: >-
        Per-call exposure contribution when contribution=fixed-weight.
    spendAmountField:
      type: string
      default: params.amount
      description: >-
        Dot-separated path into the parsed JSON-RPC request body's top-level
        object read for the numeric spend amount when contribution=spend-amount
        (e.g. "params.amount" reads body.params.amount). A request whose body
        is missing, unparseable as JSON-RPC, or missing/non-numeric at this
        path is treated as unpriceable: denied in block mode (onDeny applies),
        recorded as zero contribution in monitor mode so the gap is visible
        rather than silently inflating or deflating the total.
    estimatedTokens:
      type: number
      default: 500
      description: >-
        Pre-flight reservation estimate, in tokens, used to reserve exposure
        before authorizing when contribution=token-cost. Set this to a
        conservative upper-bound estimate for the traffic this instance
        governs: on a successful response this build COMMITS the estimate
        itself (it never reads the response body to learn a real
        usage.total_tokens figure — see the contribution field and the
        Honesty boundaries section in README.md), so an estimate set too low
        under-counts real exposure; the reservation is released outright on an
        upstream failure.
    ledgerEndpoint:
      type: string
      default: ""
      description: >-
        Reserved for Stage B: the URL of an external, distributed
        reserve-then-authorize ledger service. NOT implemented in this build —
        this field is accepted and validated (non-empty values are logged as a
        forward-compatibility notice) but every decision in this build is made
        by the in-process Stage A ledger described in this policy's summary,
        regardless of this value. Leave empty; do not depend on an external
        ledger being consulted.
    mode:
      type: string
      default: monitor
      enum:
        - monitor
        - block
      description: >-
        "monitor" — reserve and commit every call's real contribution against
        the ledger so the running total reflects true composition, log the
        verdict the call would have received, but always forward the request
        regardless of budget. Use to characterize composition before enforcing.
        "block" — deny a call whose contribution would push committed-plus-
        reserved exposure for its scope over aggregateBudget, per onDeny.
    onDeny:
      type: string
      default: rpc-error
      enum:
        - rpc-error
        - empty-403
      description: >-
        How a block-mode denial is rendered. "rpc-error" — an in-band JSON-RPC
        response reusing the request's own id(s), error code -32008, with a
        message naming the scope and the budget that would be exceeded (never
        other sessions' call content); a JSON-RPC BATCH (array) request denied
        atomically gets back a matching JSON array with one -32008 error per
        id, never a single collapsed error. "empty-403" — an HTTP 403 with an
        empty body and no JSON-RPC envelope. Regardless of this setting, a
        request this policy cannot confidently parse as JSON-RPC with
        echoable id(s) — including an ambiguous body with a duplicate JSON
        object member, where this policy and the upstream tool could
        legitimately disagree about which id is "the" id — always falls back
        to empty-403: echoing an id it cannot trust risks exposing a protected
        value. A JSON-RPC notification (no id) always gets an empty HTTP 202
        on deny, since JSON-RPC forbids a response to a notification either
        way.
    resultHeader:
      type: string
      default: x-aggregate-risk-gate
      description: >-
        Header stamped on the CLIENT-FACING RESPONSE recording the verdict and
        the running total — on an allowed or monitored call, e.g.
        "allowed;scope=agent:broker-7;contribution=800.00;total=2400.00/3000.00"
        or "monitor;scope=...;contribution=...;total=.../..."; on a block-mode
        denial, e.g. "denied;scope=agent:broker-7;would-be-total=3200.00;
        budget=3000.00" (or "reason=missing-scope-header" / "reason=unpriceable"
        for the two non-budget deny reasons). Never carries other sessions'
        call content — only the scope key and the numeric totals — so it is
        safe to forward to downstream logging, SIEM, or a Kill Switch without a
        further redaction pass.
  required:
    - budgetScope
    - scopeHeader
    - aggregateBudget
    - window
    - contribution
    - fixedWeight
    - spendAmountField
    - estimatedTokens
    - ledgerEndpoint
    - mode
    - onDeny
    - resultHeader
