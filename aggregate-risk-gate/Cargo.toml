[package]
name = "aggregate_risk_gate"
version = "1.0.0"
rust-version = "1.89.0"
edition = "2018"
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.anypoint]
group_id = "REPLACE_WITH_YOUR_ANYPOINT_ORG_ID"
definition_asset_id = "aggregate-risk-gate"
implementation_asset_id = "aggregate-risk-gate-flex"

[dependencies]
# enable_stop_iteration exposes into_headers_body_state, so a single filter can
# both inspect the body and stamp/modify headers on the same request/response.
# experimental_storage_sync exposes the synchronous shared-data handle the
# node ledger (ledgerBackend: node) uses inside one filter callback.
pdk = { version = "=1.10.0", features = ["enable_stop_iteration", "experimental_storage_sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
anyhow = "1.0"
# HMAC-SHA256 digest of the scope key for client-visible headers (issue #14).
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
# The encoding PDK local storage reads values with: named only to tell a raw
# empty host value (`Error::Eof`) from other read errors. Pinned to the
# version pdk-data-storage-lib already resolves, so no new code is pulled in.
serde_fixint = { package = "pdk-serde-fixint", version = "=1.11.0" }

[dev-dependencies]
pdk-test = { version = "=1.10.0" }
pdk-unit = { version = "=1.10.0", features = ["enable_stop_iteration", "experimental", "experimental_logs"] }
httpmock = "0.6"
reqwest = "0.11"
tokio = { version = "1", features = ["rt", "time"] }
base64 = "0.22"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
opt-level = 'z'
strip = "debuginfo"
